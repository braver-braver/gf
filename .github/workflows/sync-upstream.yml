name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream master
        run: |
          git remote add upstream https://github.com/gogf/gf.git
          git fetch upstream master
          git merge --no-edit upstream/master
          git push origin master
